# AdSpy Pro – Launch: the Shopify app merchants install to connect their store
# (OAuth handled by convex/shopifyApp.ts). Deploy this config with Shopify CLI:
#   cd shopify-app && npx @shopify/cli@latest app deploy
# Fill in client_id from the app you create in the Shopify Dev Dashboard, and
# put the same client ID and secret in Convex (SHOPIFY_API_KEY / SHOPIFY_API_SECRET).

client_id = "REPLACE_WITH_CLIENT_ID"
name = "AdSpy Pro – Launch"
application_url = "https://adspy-pro-six.vercel.app/dashboard/settings"
embedded = false

[access_scopes]
# Must match SHOPIFY_SCOPES in convex/lib/shopifyOAuth.ts.
scopes = "write_products,read_products,write_publications,read_publications,write_themes,read_themes,write_online_store_pages,read_online_store_pages,write_online_store_navigation,read_online_store_navigation,read_shipping,read_legal_policies,write_discounts,read_discounts,read_orders,read_inventory,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[auth]
redirect_urls = ["https://careful-raccoon-363.convex.site/shopify/callback"]

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://careful-raccoon-363.convex.site/shopify/webhooks"

  # Shopify's mandatory privacy webhooks. The CJ order autopilot keeps a shipping address only until the order is at
  # CJ; customers/redact deletes that customer's orders, shop/redact all of the store's order data (convex/orders.ts redact).
  # The autopilot needs "Protected customer data" (name, address, email, phone) turned on for the app in the Dev Dashboard.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://careful-raccoon-363.convex.site/shopify/webhooks"

[pos]
embedded = false
