<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 260px;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0a0a12;
        color: #f7f7f7;
        margin: 0;
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .logo {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #1fbf6b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #0a0a12;
        font-size: 13px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-top: 1px solid #222;
      }
      .row:first-of-type {
        border-top: none;
      }
      .label {
        font-size: 12px;
        color: #9a9aab;
      }
      .value {
        font-size: 13px;
        font-weight: 600;
      }
      .toggle {
        position: relative;
        width: 36px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .toggle.on {
        background: #1fbf6b;
      }
      .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s;
      }
      .toggle.on .toggle-thumb {
        transform: translateX(16px);
      }
      p.note {
        font-size: 11px;
        color: #666;
        margin-top: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">A</div>
      <h1>AdSpy Pro Collector</h1>
    </div>
    <div class="row">
      <span class="label">Collecting ads</span>
      <div class="toggle" id="toggle"><div class="toggle-thumb"></div></div>
    </div>
    <div class="row">
      <span class="label">Ads submitted</span>
      <span class="value" id="count">0</span>
    </div>
    <p class="note">
      Runs on facebook.com and tiktok.com. Collects only publicly visible sponsored ad content —
      never your personal posts, messages, or account data.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
