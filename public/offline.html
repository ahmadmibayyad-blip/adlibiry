<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - AdSpy Pro</title>
    <style>
      body {
        font-family: -apple-system, "Geist", ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #0a0a12;
        color: #f7f7f7;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 360px;
      }
      .icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: oklch(0.65 0.22 155);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
        font-size: 22px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #9a9aab;
        font-size: 0.9rem;
        margin: 0 0 1.5rem;
      }
      button {
        background: oklch(0.65 0.22 155);
        color: #0a0a12;
        border: none;
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">⚡</div>
      <h1>You're offline</h1>
      <p>AdSpy Pro needs a connection to load live ad and product data. Check your internet and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
